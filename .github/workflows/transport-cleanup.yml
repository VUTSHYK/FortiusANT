name: FortiusANT transport cleanup tests
on:
  push:
    branches: [cleanup/remove-legacy-node-dircon]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  static-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test transport cleanup
        run: python -m unittest discover -s tests -v
