name: FortiusANT CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, feature/wftnp-diagnostics]
  workflow_dispatch:

concurrency:
  group: fortiusant-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v


  application-smoke:
    name: App startup smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual headless runtime dependencies
        run: |
          python -m pip install -r pythoncode/requirementsNoGUI.txt
          python -m pip install "wftnp[discovery] @ git+https://github.com/VUTSHYK/py-wftnp.git@master"
      - name: Import production application and show CLI help
        working-directory: pythoncode
        run: |
          python -c "import FortiusAnt, FortiusAntBody, FortiusAntCommand, settings, wftnpRuntime; print('Production imports OK')"
          python FortiusAnt.py --help

  wftnp-tcp:
    name: WFTNP TCP integration (Ubuntu, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install py-wftnp
        run: python -m pip install "wftnp[discovery] @ git+https://github.com/VUTSHYK/py-wftnp.git@master"
      - name: Verify WFTNP dependency and compile modified modules
        run: |
          python -c "from wftnp import WftnpClient, WftnpServer; print('py-wftnp imports OK')"
          python -m compileall -q pythoncode/FortiusAntBody.py pythoncode/FortiusAntCommand.py pythoncode/settings.py pythoncode/wftnpRuntime.py
      - name: Test WFTNP mDNS advertisement and identity updates
        run: python -m unittest discover -s tests -p 'test_wftnp_mdns.py' -v
      - name: Run real TCP integration test
        run: python -m unittest discover -s tests -p 'test_wftnp_tcp_integration.py' -v
      - name: Validate independent raw WFTNP TCP frames
        run: python -m unittest discover -s tests -p 'test_wftnp_raw_wire.py' -v
      - name: Run threaded server integration test
        run: python -m unittest discover -s tests -p 'test_wftnp_runtime_integration.py' -v
      - name: Install simulated trainer runtime dependencies
        run: python -m pip install lib_programname pyusb numpy
      - name: Run simulated Tacx trainer through WFTNP TCP
        run: python -m unittest discover -s tests -p 'test_wftnp_simulated_trainer.py' -v

  build-windows:
    name: Build Windows executables
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/wftnp-diagnostics'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build Windows executables
        shell: cmd
        run: ci/windows/build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-WFTNP-diagnostics
          path: |
            pythoncode\dist\FortiusANT.exe
            pythoncode\dist\ExplorANT.exe
