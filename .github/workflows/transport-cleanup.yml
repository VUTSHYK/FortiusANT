name: FortiusANT CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: fortiusant-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v


  wftnp-tcp:
    name: WFTNP TCP integration (Ubuntu, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install py-wftnp
        run: python -m pip install "git+https://github.com/VUTSHYK/py-wftnp.git@af8e46ddedfe9f4cd1e16680676dadd320a77242"
      - name: Run real TCP integration test
        run: python -m unittest discover -s tests -p 'test_wftnp_tcp_integration.py' -v

  build-windows:
    name: Build Windows executables
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build Windows executables
        shell: cmd
        run: ci/windows/build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Windows artifacts
          path: |
            pythoncode\dist\FortiusANT.exe
            pythoncode\dist\ExplorANT.exe
