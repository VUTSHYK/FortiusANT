name: WFTNP compatibility tests

on:
  push:
    branches:
      - feature/dircon-ftms-compatibility
    paths:
      - 'pythoncode/wftnpTransport.py'
      - 'pythoncode/ftmsBridge.py'
      - 'pythoncode/ftmsControlPoint.py'
      - 'tests/**'
      - '.github/workflows/wftnp-tests.yml'
  pull_request:
    paths:
      - 'pythoncode/wftnpTransport.py'
      - 'pythoncode/ftmsBridge.py'
      - 'pythoncode/ftmsControlPoint.py'
      - 'tests/**'
      - '.github/workflows/wftnp-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all repository unittest tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
