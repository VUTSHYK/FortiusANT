name: WFTNP compatibility tests

on:
  push:
    branches:
      - feature/dircon-ftms-compatibility
    paths:
      - 'pythoncode/wftnpTransport.py'
      - 'pythoncode/ftmsBridge.py'
      - 'pythoncode/ftmsControlPoint.py'
      - 'tests/**'
      - 'pythoncode/requirements.txt'
      - '.github/workflows/wftnp-tests.yml'
  pull_request:
    paths:
      - 'pythoncode/wftnpTransport.py'
      - 'pythoncode/ftmsBridge.py'
      - 'pythoncode/ftmsControlPoint.py'
      - 'tests/**'
      - '.github/workflows/wftnp-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install DIRCON library and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/VUTSHYK/py-wftnp.git@4cd885df0558c6902c2fdac9f7635a5e86857ba3'
      - name: Run all repository unittest tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
